<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bone Detective Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10302d;--card:#fffdf7;--bone:#efe4c8;--boneline:#7a6545;--ink:#1f2a28;--muted:#5f6b68;--teal:#1f9c8a;--teal2:#0f6f63;--gold:#f2b632;--red:#d4473b;--line:#e2dccb}
*{box-sizing:border-box}
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 20% 0%,#1f5c55,transparent 50%),radial-gradient(circle at 100% 30%,#173f52,transparent 45%),var(--bg) fixed}
h1,h2,.bung{font-family:'Bungee',Impact,sans-serif;font-weight:400;letter-spacing:.02em}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:.2em 0;color:#fff}
h1 span{color:var(--gold)}
h2{font-size:1.45rem;margin:.1em 0 .5em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(8,26,24,.92);backdrop-filter:blur(6px);color:#d9efe9;font-size:15px}
.top a{color:#d9efe9;text-decoration:none}
.top .score{font-family:'Bungee';color:var(--gold)}
.wrap{max-width:880px;margin:0 auto;padding:22px 14px 60px}
.card{background:var(--card);border-radius:18px;padding:24px clamp(16px,4vw,30px);box-shadow:0 14px 40px rgba(0,0,0,.4);margin-bottom:18px}
.center{text-align:center}
.lede{color:#d9efe9;font-size:1.15rem;max-width:620px;margin:0 auto}
.kick{font-family:'Bungee';font-size:.8rem;color:var(--teal);letter-spacing:.06em}
.guide{display:flex;gap:12px;background:#eef8f5;border-radius:14px;padding:12px 14px;margin:12px 0}
.guide .av{flex:0 0 46px;height:46px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-size:1.5rem}
.guide p{margin:.2em 0 .3em}
.table{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff3cf,#ffe6a8);border:2px dashed #d99a12;border-radius:14px;padding:12px 16px;margin:12px 0;font-weight:700}
.table .ic{font-size:2rem}
.btn{border:none;border-radius:999px;padding:13px 24px;font-weight:700;margin:6px 6px 6px 0;font-size:1.05rem}
.btn.go{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal2)}
.btn.alt{background:#efeadb;color:var(--ink)}
.btn.skip{background:transparent;color:var(--muted);text-decoration:underline;padding:8px 10px;font-size:.95rem}
.prompt{font-weight:700;font-size:1.08rem;margin:.6em 0 .4em}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt small{display:block;color:var(--muted);font-size:.9rem}
.opt.right{background:#e2f5ef;border-color:var(--teal)}
.opt.wrong{background:#fbe8e5;border-color:var(--red);opacity:.85}
.opt.sel{background:#e8f4ff;border-color:#3a86c8}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:.98rem;animation:pop .3s}
.fb.ok{background:#e2f5ef;border:1px solid #9fd8c8}.fb.no{background:#fff0e0;border:1px solid #f2c48a}.fb.info{background:#eef3fb;border:1px solid #c5d6ee}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.fig svg{width:100%;height:auto;display:block;max-height:240px}
.fig .cap{font-size:.9rem;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;margin:8px auto 14px;max-width:420px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.trait{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.trait b{display:block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font-size:.92rem;line-height:1.25}
.seg button.on{border-color:#3a86c8;background:#e8f4ff;font-weight:700}
.inrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.inrow label{min-width:130px;font-weight:700}
input[type=number]{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:130px}
.profile{border:3px solid var(--teal);border-radius:16px;padding:18px;background:linear-gradient(135deg,#f3fbf8,#fffdf3);margin:12px 0}
.profile .row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.profile .row:last-child{border:none}
.profile .k{font-family:'Bungee';color:var(--teal2);font-size:.85rem}
.note{background:#fff8e6;border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.97rem}
.small{font-size:.9rem;color:var(--muted)}
.big{font-family:'Bungee';font-size:2rem;color:var(--teal2)}
@media (max-width:520px){.seg{grid-template-columns:1fr}.profile .row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><a href="index.html">← All stations</a><span class="bung" style="font-size:14px">🦴 Bone Detective Lab</span><span class="score" id="score">★ 0</span></div>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
let S; const fresh=()=>({screen:'title',q:0,score:0,solved:false,obs:{},skull:{},fem:{},hum:{}});
S=fresh();
const app=document.getElementById('app');
const GUIDE=h=>`<div class="guide"><div class="av">🦴</div><div><b class="kick">Lab guide</b>${h}</div></div>`;
const TABLE=h=>`<div class="table"><span class="ic">🖐️</span><span>${h}</span></div>`;
function pts(n){ S.score=Math.max(0,S.score+n); document.getElementById('score').textContent='★ '+S.score; }
function go(s){ S.screen=s; render(); window.scrollTo({top:0}); }
function fb(id,cls,msg){ const el=document.getElementById(id); el.className='fb '+cls; el.innerHTML=msg; el.hidden=false; }

/* ---------- drawings ---------- */
function pelvis(angle, cap){
  const cx=130, vy=150, L=62, a=angle/2*Math.PI/180, lx=cx-L*Math.sin(a), rx=cx+L*Math.sin(a), y2=vy+L*Math.cos(a), s=angle>90?1.13:.9;
  const aL=[78,140], aR=[182,140], ar=26, ax1=cx-ar*Math.sin(a), ay=vy+ar*Math.cos(a), ax2=cx+ar*Math.sin(a);
  const wing=side=>{ const X=x=> side<0 ? cx-(cx-x)*s : cx+((2*cx-x)-cx)*s;
    return `<path d="M${X(116)} 62 C ${X(96)} 30, ${X(40)} 22, ${X(26)} 52 C ${X(18)} 78, ${X(44)} 112, ${X(78)} 132 L ${X(108)} 122 Z"/>`; };
  return `<div class="fig"><svg viewBox="0 0 260 235" role="img" aria-label="Simplified pelvis, subpubic angle about ${angle} degrees">
   <g fill="#efe4c8" stroke="#7a6545" stroke-width="2" stroke-linejoin="round">${wing(-1)}${wing(1)}<path d="M112 56 L148 56 L141 118 L130 136 L119 118 Z" fill="#e6d8b4"/></g>
   <g stroke="#7a6545" stroke-width="16" stroke-linecap="round" fill="none"><path d="M${aL[0]} ${aL[1]} L${cx-4} ${vy} L${lx} ${y2} Z M${aR[0]} ${aR[1]} L${cx+4} ${vy} L${rx} ${y2} Z"/></g>
   <g stroke="#efe4c8" stroke-width="11" stroke-linecap="round" fill="none"><path d="M${aL[0]} ${aL[1]} L${cx-4} ${vy} L${lx} ${y2} Z M${aR[0]} ${aR[1]} L${cx+4} ${vy} L${rx} ${y2} Z"/></g>
   <circle cx="${aL[0]}" cy="${aL[1]}" r="11" fill="#d8c69c" stroke="#7a6545" stroke-width="2"/><circle cx="${aR[0]}" cy="${aR[1]}" r="11" fill="#d8c69c" stroke="#7a6545" stroke-width="2"/>
   <path d="M${ax1} ${ay} A ${ar} ${ar} 0 0 0 ${ax2} ${ay}" fill="none" stroke="#d4473b" stroke-width="3"/>
   <text x="${cx}" y="${Math.max(ay,y2)+26}" text-anchor="middle" font-family="Bungee" font-size="15" fill="#d4473b">≈ ${angle}°</text></svg><div class="cap">${cap}</div></div>`;
}
/* long bone, front view, head on given side ('L' or 'R' of the viewer) */
function longBone(type, head){
  const f = head==='R' ? 1 : -1, cx=100;
  const H = (x)=> cx + f*x;
  if(type==='femur') return `<svg viewBox="0 0 200 300" role="img" aria-label="Femur seen from the front with its head pointing to the viewer's ${head==='R'?'right':'left'}">
    <g fill="#efe4c8" stroke="#7a6545" stroke-width="2.5" stroke-linejoin="round">
      <path d="M${H(-14)} 40 L${H(-26)} 34 L${H(-30)} 60 L${H(-12)} 78 L${H(-10)} 250 L${H(14)} 250 L${H(14)} 78 L${H(28)} 58 L${H(12)} 44 Z"/>
      <circle cx="${H(36)}" cy="34" r="17"/>
      <path d="M${H(8)} 46 L${H(24)} 36 L${H(32)} 48 L${H(14)} 62 Z"/>
      <ellipse cx="${H(-6)}" cy="262" rx="20" ry="16"/><ellipse cx="${H(14)}" cy="262" rx="18" ry="15"/></g>
    <text x="${H(-34)}" y="52" font-size="11" text-anchor="middle" fill="#5f6b68">greater</text><text x="${H(-34)}" y="64" font-size="11" text-anchor="middle" fill="#5f6b68">trochanter</text>
    <text x="${H(48)}" y="12" font-size="12" text-anchor="middle" fill="#d4473b" font-weight="700">head</text>
    <text x="100" y="296" font-size="11" text-anchor="middle" fill="#5f6b68">knee end</text></svg>`;
  return `<svg viewBox="0 0 200 300" role="img" aria-label="Humerus seen from the front with its head pointing to the viewer's ${head==='R'?'right':'left'}">
    <g fill="#efe4c8" stroke="#7a6545" stroke-width="2.5" stroke-linejoin="round">
      <path d="M${H(-18)} 34 C ${H(-24)} 54, ${H(-14)} 70, ${H(-8)} 80 L${H(-7)} 236 L${H(-30)} 252 L${H(-26)} 266 L${H(30)} 266 L${H(34)} 252 L${H(10)} 236 L${H(10)} 80 C ${H(16)} 66, ${H(20)} 54, ${H(14)} 40 Z"/>
      <circle cx="${H(22)}" cy="40" r="20"/>
      <ellipse cx="${H(0)}" cy="250" rx="10" ry="7" fill="#d8c69c"/></g>
    <text x="${H(38)}" y="12" font-size="12" text-anchor="middle" fill="#d4473b" font-weight="700">head</text>
    <text x="100" y="292" font-size="11" text-anchor="middle" fill="#5f6b68">elbow end</text></svg>`;
}

/* ---------- Part 1: quiz ---------- */
const QZ=[
  {q:'Which is the longest and strongest bone in the human body?',o:[['Humerus',0],['Femur',1],['Clavicle',0],['Skull',0]],e:'The femur (thigh bone). It’s about a quarter of your height, which is why it’s so useful for estimating how tall someone was.'},
  {q:'Your collarbone has a scientific name. What is it?',o:[['Scapula',0],['Sternum',0],['Clavicle',1]],e:'The clavicle. It’s one of the most commonly broken bones, and one of the last bones in the body to finish growing.'},
  {q:'Where in your body is the humerus?',o:[['Upper arm',1],['Thigh',0],['Forearm',0]],e:'The upper arm. That “funny bone” zing is actually a nerve passing over the elbow end of your humerus!'},
  {q:'The <b>greater trochanter</b> is a big bump where strong hip muscles attach. Which bone is it on?',o:[['Pelvis',0],['Humerus',0],['Femur',1]],e:'It’s on the femur, just below the round head. You can feel your own as a hard knob on the outside of your hip.'},
  {q:'The <b>olecranon fossa</b> is a deep pit at the elbow end of a bone. Which bone?',o:[['Humerus',1],['Clavicle',0],['Femur',0]],e:'It’s on the humerus. When you straighten your arm, a hook of your forearm bone slides into this pit. It’s on the <b>back</b> of the bone, which helps you tell front from back!'},
  {q:'The <b>mastoid process</b> is a bump you can feel behind your ear. Which bone is it part of?',o:[['Clavicle',0],['Skull',1],['Pelvis',0]],e:'The skull. Neck muscles attach there, and it tends to be larger in males. You’ll check it on the real skull in Part 2.'},
  {q:'The <b>greater sciatic notch</b> is a curved notch on the back of the hip bone. Which bone?',o:[['Pelvis',1],['Femur',0],['Skull',0]],e:'The pelvis. A wide notch is a typical female trait, and a narrow one is a typical male trait.'},
  {q:'This femur is shown from the <b>front</b>. The head always points toward the <b>middle</b> of the body. Is it a left or right femur?',fig:()=>longBone('femur','R'),o:[['Left femur',0],['Right femur',1]],
    e:'Right! Picture the skeleton facing you: its <b>right</b> leg is on <b>your</b> left, and the head of that femur points inward, toward your right. <b>Rule: front view, head points to your right = right femur.</b>'},
  {q:'Same rule for the humerus. Front view, head points toward the middle of the body. Left or right?',fig:()=>longBone('humerus','L'),o:[['Left humerus',1],['Right humerus',0]],
    e:'Left! The head points to your left, so this bone belongs on the skeleton’s left side. Tip: the elbow pit (olecranon fossa) is on the <b>back</b>, so if you can see that pit, flip the bone around first.'}
];
function quiz(){
  const it=QZ[S.q];
  return `<div class="bar"><i style="width:${S.q/QZ.length*100}%"></i></div>
  <div class="card"><div class="kick">Part 1 · Bone ID warm-up · ${S.q+1} of ${QZ.length}</div>
  <p class="prompt">${it.q}</p>${it.fig?`<div class="figrow"><div class="fig">${it.fig()}</div></div>`:''}
  <div class="opts">${it.o.map((o,i)=>`<button class="opt" onclick="answer(${i})">${o[0]}</button>`).join('')}</div>
  <div class="fb" id="qfb" hidden></div><div id="qnext" hidden><button class="btn go" onclick="nextQ()">${S.q<QZ.length-1?'Next →':'On to the real bones →'}</button></div></div>`;
}
let wrongOnce=false;
function answer(i){
  if(S.solved) return; const it=QZ[S.q], btns=document.querySelectorAll('.opt'), b=btns[i];
  if(it.o[i][1]){ S.solved=true; b.classList.add('right'); btns.forEach(x=>x.disabled=true); pts(wrongOnce?5:10); fb('qfb','ok','✅ '+it.e); document.getElementById('qnext').hidden=false; }
  else { wrongOnce=true; b.classList.add('wrong'); b.disabled=true; fb('qfb','no','🤔 Not quite. Try again!'); }
}
function nextQ(){ S.solved=false; wrongOnce=false; if(S.q<QZ.length-1){ S.q++; go('quiz'); } else go('part2'); }

/* ---------- Part 2: hands-on ---------- */
function choose(key, val, msg){ S.obs[key]=val; document.querySelectorAll(`[data-k="${key}"]`).forEach(b=>b.classList.toggle('sel',b.dataset.v===val));
  fb(key+'-fb','info',msg); document.getElementById(key+'-next').hidden=false; }
function obsBtns(key, list){ return `<div class="opts">${list.map(([v,label,sub,msg])=>`<button class="opt ${S.obs[key]===v?'sel':''}" data-k="${key}" data-v="${v}" onclick="choose('${key}','${v}',this.dataset.m)" data-m="${msg.replace(/"/g,'&quot;')}">${label}${sub?`<small>${sub}</small>`:''}</button>`).join('')}</div>`; }
const STEPS=['pelvis','skull','clavicle','sutures','femur','humerus'];
function stepHead(i,title){ return `<div class="bar"><i style="width:${i/STEPS.length*100}%"></i></div><div class="card"><div class="kick">Part 2 · Real bones · Step ${i+1} of ${STEPS.length}</div><h2>${title}</h2>`; }
const nextBtn=(key,to)=>`<div class="fb" id="${key}-fb" hidden></div><div id="${key}-next" ${S.obs[key]?'':'hidden'}><button class="btn go" onclick="go('${to}')">Next →</button></div>`;
const skip=(to,key)=>`<button class="btn skip" onclick="S.obs['${key}']='skip';go('${to}')">We don’t have this bone here, skip it</button>`;

const SCREENS={
 title:()=>`<div class="center" style="padding:10px 0 18px"><div style="font-size:2.6rem">🦴💀🦴</div><h1>Bone <span>Detective</span> Lab</h1>
   <p class="lede">Forensic anthropologists can tell who someone was from their skeleton. Warm up on screen, then use the <b>real bones</b> on the table to build a profile.</p></div>
   <div class="card">${GUIDE('<p>Here’s the plan:</p>')}
   <ol><li><b>Part 1, Bone ID warm-up</b> (on screen): name the bones and their features, and figure out left from right.</li>
   <li><b>Part 2, Real bones</b> (hands-on): examine the pelvis, skull, clavicle, femurs and humeri on the table. Record what you see, and the lab builds your skeleton’s profile.</li></ol>
   <p class="small">About 10 minutes · Handle the bones gently, with two hands, over the table.</p>
   <button class="btn go" onclick="go('quiz')">Start →</button></div>`,
 quiz,
 part2:()=>`<div class="card center"><div class="kick">Part 1 complete</div><div class="big">★ ${S.score}</div>
   ${GUIDE('<p>Nice warm-up! Now for the real thing. Forensic anthropologists build a <b>biological profile</b>: sex, age and height. You won’t get graded in this part. Just look carefully and report what you see, like a real scientist.</p>')}
   <button class="btn go" onclick="go('pelvis')">To the table →</button></div>`,
 pelvis:()=>`${stepHead(0,'The pelvis: the best clue to sex')}
   ${TABLE('Pick up the <b>pelvis</b>. Look at the front, at the arch under the pubic bones.')}
   <div class="figrow">${pelvis(62,'Narrow, V-shaped arch (often under 70°)')}${pelvis(112,'Wide, U-shaped arch (often 90° or more)')}</div>
   ${GUIDE('<p><b>Thumb test:</b> turn the pelvis around and find the <b>greater sciatic notch</b> on the back of the hip bone. If your thumb wiggles around freely, it’s wide. If it fits snugly, it’s narrow.</p>')}
   <p class="prompt">What do you see?</p>
   ${obsBtns('pelvis',[
     ['F','Wide, U-shaped arch and a wide notch','My thumb wiggles freely','Those are typical <b>female</b> traits: a wider pelvis makes room for childbirth.'],
     ['M','Narrow, V-shaped arch and a narrow notch','My thumb fits snugly','Those are typical <b>male</b> traits.'],
     ['U','Somewhere in between, or the two clues disagree','','That happens! Real anthropologists sometimes record “indeterminate.” We’ll lean on the skull too.']])}
   ${nextBtn('pelvis','skull')}${skip('skull','pelvis')}</div>`,
 skull:()=>{ const T=[['brow','Brow ridge','Run a finger above the eye sockets.','Smooth, flat forehead','In between','Heavy, bulging ridge'],
     ['mastoid','Mastoid process','The bump behind the ear hole.','Small, about pinkie-tip size','In between','Large, about thumb size'],
     ['chin','Chin','Look at the front of the lower jaw (if your skull has one).','Rounded or pointed','In between','Square and broad'],
     ['nuchal','Back of the skull','Feel the base at the back, where neck muscles attach.','Smooth','Small bump','Rough ridge or hook']];
   const all=T.every(t=>S.skull[t[0]]);
   return `${stepHead(1,'The skull: four sex traits')}
   ${TABLE('Pick up the <b>skull</b>. Score each trait from smooth and small to big and rugged.')}
   ${GUIDE('<p>Male skulls <i>tend</i> to be more rugged, with bigger bumps where muscles attach. These are tendencies, not rules, so we look at several traits together.</p>')}
   ${T.map(t=>`<div class="trait"><b>${t[1]}</b><span class="small">${t[2]}</span><div class="seg">
     ${['F','U','M'].map((v,i)=>`<button class="${S.skull[t[0]]===v?'on':''}" onclick="S.skull['${t[0]}']='${v}';render()">${t[3+i]}</button>`).join('')}</div></div>`).join('')}
   ${all?`<div class="fb info">Skull score: ${skullText()}</div><button class="btn go" onclick="S.obs.skull='done';go('clavicle')">Next →</button>`:'<p class="small">Score all four traits to continue. If your skull has no jaw, pick “In between” for the chin.</p>'}
   ${skip('clavicle','skull')}</div>`; },
 clavicle:()=>`${stepHead(2,'The clavicle: a clue to age')}
   ${TABLE('Pick up the <b>clavicle</b>. Find the round, chunky end. That’s the end that met the breastbone (the sternal end).')}
   ${GUIDE('<p>Bones grow from <b>growth plates</b>. When growing stops, the plates fuse into solid bone. The breastbone end of the clavicle is one of the <b>last</b> to fuse, usually finishing somewhere between the early 20s and about 30.</p>')}
   <p class="prompt">What does the sternal end look like?</p>
   ${obsBtns('clavicle',[
     ['young','Rough and wavy, like a bumpy crater, with no cap','','The growth plate hadn’t started fusing yet. That points to a <b>teenager or someone in their early 20s</b>.'],
     ['mid','A cap that’s partly attached, with a visible line or gap','','Fusion was in progress. That points to roughly the <b>late teens to about 30</b>.'],
     ['adult','Smooth and solid, fully fused with no line','','Fully fused. That points to an <b>adult, likely older than about 25</b>.']])}
   ${nextBtn('clavicle','sutures')}${skip('sutures','clavicle')}</div>`,
 sutures:()=>`${stepHead(3,'Skull sutures: another age clue')}
   ${TABLE('Back to the <b>skull</b>. Look at the wavy seams (sutures) across the top, where the skull bones meet.')}
   ${GUIDE('<p>Sutures slowly close with age, but at very different speeds in different people. Scientists treat this as a <b>weak</b> clue that only helps alongside other evidence.</p>')}
   <p class="prompt">What do the sutures look like?</p>
   ${obsBtns('sutures',[
     ['open','Wide open: clear, zig-zag lines all over','','Suggests a <b>younger adult</b>.'],
     ['partial','Partly closed: some lines faint or missing','','Suggests a <b>middle-aged adult</b>, roughly 30s to 50s.'],
     ['closed','Mostly gone: hard to find the lines at all','','Suggests an <b>older adult</b>, though some young people close early!']])}
   ${nextBtn('sutures','femur')}${skip('femur','sutures')}</div>`,
 femur:()=>`${stepHead(4,'The femurs: height, and one person or two?')}
   ${TABLE('Measure <b>both femurs</b>. Lay each on the ruler or measuring board, from the top of the round head to the bottom of the knee end.')}
   <div class="figrow"><div class="fig">${longBone('femur','R')}<div class="cap">Right femur (front view)</div></div><div class="fig">${longBone('femur','L')}<div class="cap">Left femur (front view)</div></div></div>
   ${GUIDE('<p>Use your Part 1 rule to tell which femur is which. Front view: head points to your right = <b>right</b> femur.</p>')}
   <div class="inrow"><label for="fl">Left femur</label><input id="fl" type="number" step="0.1" min="20" max="65" value="${S.fem.L||''}"> cm</div>
   <div class="inrow"><label for="fr">Right femur</label><input id="fr" type="number" step="0.1" min="20" max="65" value="${S.fem.R||''}"> cm</div>
   <button class="btn alt" onclick="calcFem()">Calculate</button><div class="fb" id="femur-fb" hidden></div>
   <div id="femur-next" ${S.fem.L||S.fem.R?'':'hidden'}><button class="btn go" onclick="go('humerus')">Next →</button></div>${skip('humerus','femur')}</div>`,
 humerus:()=>`${stepHead(5,'The humeri: left, right and a second height estimate')}
   ${TABLE('Pick up <b>both humeri</b>. Use the rule: front view (elbow pit facing away from you), head points to your right = <b>right</b> humerus.')}
   <div class="figrow"><div class="fig">${longBone('humerus','R')}<div class="cap">Right humerus (front view)</div></div><div class="fig">${longBone('humerus','L')}<div class="cap">Left humerus (front view)</div></div></div>
   <p class="small">Sort them into left and right, then measure each from the top of the head to the bottom of the elbow end.</p>
   <div class="inrow"><label for="hl">Left humerus</label><input id="hl" type="number" step="0.1" min="15" max="45" value="${S.hum.L||''}"> cm</div>
   <div class="inrow"><label for="hr">Right humerus</label><input id="hr" type="number" step="0.1" min="15" max="45" value="${S.hum.R||''}"> cm</div>
   <button class="btn alt" onclick="calcHum()">Calculate</button><div class="fb" id="humerus-fb" hidden></div>
   <div id="humerus-next" ${S.hum.L||S.hum.R?'':'hidden'}><button class="btn go" onclick="go('profile')">See the profile →</button></div>${skip('profile','humerus')}</div>`,
 profile:()=>{ const sx=sexCall(), age=ageCall(), st=statureText();
   return `<div class="bar"><i style="width:100%"></i></div><div class="card"><div class="kick">Case complete</div><h2>Your skeleton’s biological profile</h2>
   <div class="profile">
     <div class="row"><span class="k">Sex</span><span>${sx}</span></div>
     <div class="row"><span class="k">Age</span><span>${age}</span></div>
     <div class="row"><span class="k">Height</span><span>${st}</span></div>
     <div class="row"><span class="k">One person?</span><span>${matchText()}</span></div></div>
   <div class="note">🎤 <b>Now ask your host for the answer key!</b> See how close your team got.</div>
   ${GUIDE('<p>Notice how each answer is a <b>range</b> or a <b>likely</b>, never a sure thing? Real forensic anthropologists work the same way. They combine many clues and report how confident they are. Police then compare the profile with missing-person reports, and DNA or dental records confirm who it was.</p>')}
   <p class="small">Part 1 score: ★ ${S.score}</p>
   <button class="btn go" onclick="S=fresh();pts(0);go('title')">Play again</button>
   <a class="btn alt" style="text-decoration:none;display:inline-block" href="index.html">← Back to all stations</a></div>`; }
};

/* ---------- interpretation ---------- */
function skullScore(){ return Object.values(S.skull).reduce((s,v)=>s+(v==='F'?-1:v==='M'?1:0),0); }
function skullText(){ const s=skullScore(); return s<=-2?'mostly <b>female-typical</b> traits.':s>=2?'mostly <b>male-typical</b> traits.':'mixed traits, which is <b>indeterminate</b> on its own.'; }
function sexNum(){ let s=0; if(S.obs.pelvis==='F') s-=3; if(S.obs.pelvis==='M') s+=3; if(Object.keys(S.skull).length) s+=skullScore(); return s; }
function sexKey(){ const s=sexNum(); return s<=-2?'F':s>=2?'M':'U'; }
function sexCall(){ if(S.obs.pelvis==='skip'&&!Object.keys(S.skull).length) return 'Not examined.';
  const k=sexKey(), base={F:'<b>Probably female</b>',M:'<b>Probably male</b>',U:'<b>Indeterminate</b>, the clues don’t agree strongly'}[k];
  const conflict=(S.obs.pelvis==='F'&&skullScore()>=2)||(S.obs.pelvis==='M'&&skullScore()<=-2);
  return base+(conflict?' (pelvis and skull disagree, and experts trust the pelvis more)':'')+'.'; }
function ageCall(){ const c=S.obs.clavicle, u=S.obs.sutures;
  let a = c==='young'?'Teen to early 20s':c==='mid'?'Late teens to about 30':c==='adult'?'Adult, likely over 25':'';
  if(c==='adult' && u==='closed') a='Adult, possibly older (40+)';
  if(c==='adult' && u==='partial') a='Adult, likely 30s to 50s';
  if(c==='adult' && u==='open') a='Adult, probably 25 to 40';
  if(!a) a = u==='open'?'Possibly a younger adult (sutures only, a weak clue)':u==='partial'?'Possibly middle-aged (sutures only, a weak clue)':u==='closed'?'Possibly older (sutures only, a weak clue)':'Not examined';
  if((c==='young'||c==='mid') && u==='closed') a+=' (the sutures say older, but the clavicle is the stronger clue)';
  return '<b>'+a+'</b>'; }
/* Trotter & Gleser (1952, 1958) formulas */
const F={F:{fem:[2.47,54.10,3.72],hum:[3.36,57.97,4.45]},M:{fem:[2.38,61.41,3.27],hum:[3.08,70.45,4.05]}};
const toFt=cm=>{ const inch=Math.round(cm/2.54); return `${Math.floor(inch/12)}′${inch%12}″`; };
function est(bone,len,k){ const [m,b,e]=F[k][bone]; const h=m*len+b; return {h,e}; }
function avg(o){ const v=[o.L,o.R].filter(Boolean); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function heightLine(bone,len){ const k=sexKey();
  if(k==='U'){ const f=est(bone,len,'F'), m=est(bone,len,'M'); return `${Math.round(f.h)} cm (${toFt(f.h)}) using the female formula, or ${Math.round(m.h)} cm (${toFt(m.h)}) using the male formula`; }
  const r=est(bone,len,k); return `about <b>${Math.round(r.h)} cm (${toFt(r.h)})</b>, give or take ${Math.round(r.e)} cm`; }
function readPair(a,b,obj){ const L=parseFloat(document.getElementById(a).value), R=parseFloat(document.getElementById(b).value); obj.L=isNaN(L)?null:L; obj.R=isNaN(R)?null:R; return obj.L||obj.R; }
function calcFem(){ if(!readPair('fl','fr',S.fem)) return fb('femur-fb','no','Enter at least one femur length.');
  const a=avg(S.fem); fb('femur-fb','info',`📏 Height from the femur: ${heightLine('fem',a)}.<br>${pairNote(S.fem,'femurs')}<br><span class="small">Formula: Trotter &amp; Gleser. There are different versions for males and females, which is why we estimated sex first.</span>`);
  document.getElementById('femur-next').hidden=false; }
function calcHum(){ if(!readPair('hl','hr',S.hum)) return fb('humerus-fb','no','Enter at least one humerus length.');
  const a=avg(S.hum); let msg=`📏 Height from the humerus: ${heightLine('hum',a)}.<br>${pairNote(S.hum,'humeri')}`;
  const f=avg(S.fem); if(f && sexKey()!=='U'){ const d=Math.abs(est('fem',f,sexKey()).h-est('hum',a,sexKey()).h); msg+=`<br>${d<=6?'✅ This agrees with your femur estimate. Two bones pointing to the same height means more confidence!':'🤔 This is pretty different from your femur estimate. Could these bones come from different people?'}`; }
  fb('humerus-fb','info',msg); document.getElementById('humerus-next').hidden=false; }
function pairNote(o,name){ if(!(o.L&&o.R)) return 'Measure both sides to check whether they match.';
  const d=Math.abs(o.L-o.R); return d<=1.5?`✅ Left and right ${name} differ by ${d.toFixed(1)} cm, close enough to belong to one person.`:`🤔 Left and right ${name} differ by ${d.toFixed(1)} cm. That’s a lot! Real labs check this, because a box of bones can hold more than one person.`; }
function statureText(){ const f=avg(S.fem), h=avg(S.hum); const out=[];
  if(f) out.push('From the femur: '+heightLine('fem',f)); if(h) out.push('From the humerus: '+heightLine('hum',h));
  return out.length?out.join('<br>'):'Not measured.'; }
function matchText(){ const n=[]; if(S.fem.L&&S.fem.R) n.push(Math.abs(S.fem.L-S.fem.R)<=1.5?'Femurs match':'Femurs don’t match');
  if(S.hum.L&&S.hum.R) n.push(Math.abs(S.hum.L-S.hum.R)<=1.5?'humeri match':'humeri don’t match');
  return n.length?n.join(', ')+'.':'Measure both sides of a bone to check.'; }

function render(){ app.innerHTML=SCREENS[S.screen](); }
render();
</script>
</body>
