<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bones of Briar Hollow — A Forensic Mystery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141b27; --paper:#f7f2e6; --paper2:#efe6d2; --ink:#2a251e; --muted:#6d6457;
  --red:#b23a2e; --teal:#2c7a6f; --gold:#c8962b; --blue:#2d5d8a; --line:#d9ccb0;
  --cork:#7a5b3c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 20% 0%,#26324d,#141b27 60%) fixed;color:var(--ink);
  font-family:'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif;font-size:18px;line-height:1.55;min-height:100vh}
h1,h2,h3,.type{font-family:'Special Elite','Courier New',monospace;font-weight:400;letter-spacing:.01em}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:.2em 0 .3em}
h2{font-size:1.7rem;margin:0 0 .4em}
h3{font-size:1.25rem;margin:1.2em 0 .4em}
p{margin:.5em 0 .9em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 18px;background:rgba(12,17,26,.94);backdrop-filter:blur(6px);color:#e9e2d2;border-bottom:1px solid #2c3850}
.brand{font-family:'Special Elite',monospace;font-size:17px;white-space:nowrap}
.brand span{color:var(--gold)}
.meta{display:flex;gap:12px;align-items:center;font-size:15px;color:#c9c0ae}
.filebtn{display:none;background:#2a3550;color:#fff;border:1px solid #44527a;border-radius:20px;padding:6px 12px;font-size:15px}
.filebtn b{background:var(--gold);color:#1a1a1a;border-radius:10px;padding:0 7px;margin-left:4px}

.layout{max-width:1200px;margin:0 auto;padding:22px 16px 70px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
main{outline:none;min-width:0}
.card{background:var(--paper);border-radius:14px;padding:26px clamp(18px,4vw,32px);box-shadow:0 12px 34px rgba(0,0,0,.4);position:relative;margin-bottom:18px}
.card::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(120,100,60,.05) 31px 32px)}
.kicker{font-family:'Special Elite',monospace;color:var(--red);font-size:.9rem;text-transform:uppercase;letter-spacing:.12em}
.small{font-size:.92rem;color:var(--muted)}
.lede{font-size:1.15rem}

/* casefile */
aside{position:sticky;top:72px;background:#f3ecdc;border-radius:12px;padding:16px 16px 12px;box-shadow:0 10px 28px rgba(0,0,0,.4);max-height:calc(100vh - 92px);overflow:auto}
aside h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
aside .tab{position:absolute;top:-12px;left:18px;background:#e7d8b6;padding:2px 12px;border-radius:6px 6px 0 0;font-family:'Special Elite';font-size:13px}
.clue{display:flex;gap:10px;padding:9px 0;border-top:1px dashed #cdbd99;font-size:.93rem;line-height:1.35;animation:pop .4s ease}
.clue .ic{font-size:1.3rem;line-height:1}
.clue b{display:block}
.empty{color:var(--muted);font-size:.93rem}
.closefile{display:none;background:none;border:none;font-size:1.4rem}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* dialog + notes */
.say{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);padding:12px 14px;border-radius:10px;margin:14px 0}
.say .av{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:#e4ecf5}
.say .who{font-weight:700;font-size:.9rem;color:var(--blue);text-transform:uppercase;letter-spacing:.05em}
.say p{margin:.2em 0 .4em}
.note{background:#fff8e6;border:1px solid #ecd9a6;border-left:5px solid var(--gold);padding:12px 14px;border-radius:10px;margin:14px 0;font-size:.97rem}
.note b.h{display:block;font-family:'Special Elite';color:#8a6512;margin-bottom:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:12px 20px;font-weight:700;margin:6px 8px 6px 0;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 3px 0 #7d2219}
.btn.primary:hover{background:#c4443a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.dark{background:#2a3550;color:#fff;box-shadow:0 3px 0 #161d2e}
.btn:disabled{opacity:.5;cursor:not-allowed}

.q{margin:18px 0}
.prompt{font-weight:700;font-size:1.08rem}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f8fbff}
.opt.right{background:#e1f3ee;border-color:var(--teal)}
.opt.wrong{background:#f9e4e1;border-color:var(--red);opacity:.85;text-decoration:line-through;text-decoration-color:rgba(178,58,46,.5)}
.opt:disabled{cursor:default}
.opt small{display:block;color:var(--muted);font-size:.9rem}
.fb{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:.98rem;animation:pop .3s ease}
.fb.ok{background:#e1f3ee;border:1px solid #9fd2c4}
.fb.no{background:#fbecd9;border:1px solid #efc58e}
.next{margin-top:12px}

/* board */
.boardwrap{background:var(--cork);background-image:radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px);
  background-size:9px 9px,13px 13px;border-radius:14px;padding:22px;box-shadow:inset 0 0 0 8px #4e3a25,0 12px 34px rgba(0,0,0,.4);margin-bottom:18px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.loc{position:relative;text-align:left;background:var(--paper);border:none;border-radius:4px;padding:22px 16px 16px;box-shadow:0 6px 14px rgba(0,0,0,.35);color:var(--ink);min-height:150px;transition:transform .15s}
.loc:nth-child(odd){transform:rotate(-1deg)} .loc:nth-child(even){transform:rotate(.8deg)}
.loc:hover:not(:disabled){transform:rotate(0) scale(1.03)}
.loc::before{content:"";position:absolute;top:7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a6b,#a3261a);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.loc .ic{font-size:2rem;display:block}
.loc .t{font-family:'Special Elite';font-size:1.2rem;display:block;margin:4px 0 2px}
.loc .d{font-size:.92rem;color:var(--muted);display:block}
.loc:disabled{filter:grayscale(.8);opacity:.7;cursor:not-allowed}
.badge{position:absolute;top:10px;right:10px;font-family:'Special Elite';font-size:.8rem;color:var(--teal);border:2px solid var(--teal);padding:0 6px;border-radius:4px;transform:rotate(6deg)}
.hint{background:#fff;border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:.98rem;display:flex;gap:10px}

/* figures */
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;margin:12px 0}
.fig{width:100%;height:auto;display:block}
.figbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.figbox.ev{border:2px solid var(--red)}
.figbox .cap{font-size:.9rem;color:var(--muted);margin-top:4px}
.figbox.ev .cap{color:var(--red);font-weight:700}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:12px 0}
.scrollx svg{min-width:600px}
.clues3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.cluecard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.96rem}
.cluecard b{display:block;font-family:'Special Elite';color:var(--blue);margin-bottom:4px}
.profile{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill{background:#2a3550;color:#fff;border-radius:20px;padding:4px 12px;font-size:.92rem}
.inrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=number],input[type=text]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;width:160px}
input#detname{width:min(100%,340px)}
select{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.marks{display:grid;gap:12px;margin:12px 0}
.mark{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mark.okm{border-color:var(--teal);background:#eef8f5}
.mark.nom{border-color:var(--red);background:#fdf0ee}
.mark b{font-family:'Special Elite';color:var(--blue)}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.def{border-radius:10px;padding:10px 12px;font-size:.93rem;background:#fff;border-top:5px solid}
.def b{display:block}

/* spots */
.spots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.spot{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:14px 10px;text-align:center;color:var(--ink)}
.spot .ic{font-size:2rem;display:block}
.spot.done{border-style:solid;border-color:var(--teal);background:#eef8f5}
.spot:hover{border-color:var(--blue)}
.found{background:#fff;border-radius:12px;border:1px solid var(--line);padding:14px 16px;margin:12px 0;animation:pop .3s}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:14px 0}
.sus{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.sus:hover:not(:disabled){border-color:var(--blue)}
.ava{flex:0 0 54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Special Elite';font-size:1.25rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ava.big{flex-basis:76px;height:76px;font-size:1.7rem}
.sus .nm{font-weight:700;display:block}
.sus .rl{font-size:.9rem;color:var(--muted);display:block}
.sus .st{font-size:.85rem;display:block;margin-top:4px}
.qbtns{display:grid;gap:8px;margin:12px 0}
.transcript{border-left:3px solid var(--line);padding-left:14px;margin:12px 0}
.transcript .qq{font-weight:700;color:var(--blue);margin-top:10px}
.transcript .aa{margin:.2em 0 .6em}

/* blood */
.wells{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.wellbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.wellbox .lbl{font-weight:700;margin:4px 0}
.wellbox .res{font-size:.88rem;min-height:1.3em;color:var(--muted)}
.wellbox button{font-size:.9rem;padding:8px 10px;margin:4px 0 0}
table.types{border-collapse:collapse;width:100%;margin:10px 0;font-size:.96rem;background:#fff}
table.types th,table.types td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.types th{background:var(--paper2)}
.checks{display:grid;gap:8px;margin:10px 0}
.checks label{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.checks input{width:20px;height:20px}

/* gel */
.gelwrap{background:#0f1726;border-radius:12px;padding:10px;margin:12px 0;overflow-x:auto}
.gelwrap svg{min-width:520px;width:100%;height:auto;display:block}
.lane{cursor:pointer}
.lane:hover .lanebg{fill:rgba(255,255,255,.08)}
.lane.sel .lanebg{fill:rgba(200,150,43,.22);stroke:#c8962b;stroke-width:2}

/* endings */
.ending{border:3px double var(--red)}
.stampbig{display:inline-block;font-family:'Special Elite';color:var(--red);border:4px solid var(--red);padding:4px 16px;font-size:1.8rem;transform:rotate(-5deg);margin:6px 0 12px;border-radius:6px;opacity:.9}
.stampbig.alt{color:#8a6512;border-color:#8a6512}
.cert{background:linear-gradient(135deg,#fffaf0,#f3e7c9);border:2px solid var(--gold);border-radius:14px;padding:20px;text-align:center;margin:16px 0}
.cert .rank{font-family:'Special Elite';font-size:1.8rem;color:#8a6512}
.chain{counter-reset:c;list-style:none;padding:0;margin:12px 0}
.chain li{counter-increment:c;padding:8px 0 8px 40px;position:relative;border-bottom:1px dashed var(--line)}
.chain li::before{content:counter(c);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
details.edu{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.edu summary{cursor:pointer;font-weight:700}
details.edu li{margin:4px 0}
.stamp{display:inline-block;font-family:'Special Elite';color:var(--red);border:2px solid var(--red);padding:2px 10px;border-radius:4px;transform:rotate(-3deg);font-size:.9rem}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .filebtn{display:inline-block}
  aside{display:none;position:fixed;top:60px;left:10px;right:10px;max-height:calc(100vh - 80px);z-index:40}
  aside.open{display:block}
  .closefile{display:inline}
}
@media (max-width:520px){
  body{font-size:17px}
  .wells{grid-template-columns:1fr}
  .brand{font-size:15px}
  .meta #progress{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><a href="index.html" style="color:#c9c0ae;text-decoration:none;margin-right:12px;font-family:'Source Sans 3',sans-serif;font-size:15px">← All stations</a>🔎 Briar Hollow <span>Case #BH-27</span></div>
  <div class="meta"><span id="progress"></span><button class="filebtn" id="fileBtn" onclick="toggleFile()">📁 Case File<b id="clueCount">0</b></button></div>
</header>
<div class="layout">
  <main id="stage" tabindex="-1" aria-live="polite"></main>
  <aside id="casefile" aria-label="Case file">
    <h3><span>📁 Case File</span><button class="closefile" onclick="toggleFile()" aria-label="Close case file">✕</button></h3>
    <div id="cluelist"></div>
    <p class="small" id="mistakeline"></p>
  </aside>
</div>
<noscript><p style="color:#fff;padding:20px">This mystery needs JavaScript turned on.</p></noscript>

<script>
/* ---------- state ---------- */
const fresh = () => ({ name:'Detective', mistakes:0, done:{}, clues:[], searched:{}, sus:{gordon:{q:{}},theo:{q:{}},alan:{q:{}},megan:{q:{}}},
  meganSample:null, wells:{}, judgeDenied:false, scene:'title', arg:null, flash:'' });
let S = fresh();
const Q = {};
const $ = s => document.querySelector(s);
const stage = $('#stage');

function go(id, arg){ S.scene=id; S.arg=arg; draw(); window.scrollTo({top:0}); stage.focus({preventScroll:true}); closeFile(); }
function draw(){ stage.innerHTML = SC[S.scene](S.arg); renderFile(); }
function oops(){ S.mistakes++; renderFile(); }
function addClue(k, ic, t, d){ if(!S.clues.find(c=>c.k===k)){ S.clues.push({k,ic,t,d}); renderFile(); } }
function has(k){ return !!S.clues.find(c=>c.k===k); }
function renderFile(){
  $('#cluelist').innerHTML = S.clues.length ? S.clues.map(c=>`<div class="clue"><span class="ic">${c.ic}</span><span><b>${c.t}</b>${c.d}</span></div>`).join('')
    : '<p class="empty">No clues yet. Every clue you find will be pinned here.</p>';
  $('#clueCount').textContent = S.clues.length;
  $('#progress').textContent = `Clues: ${S.clues.length} · Wrong turns: ${S.mistakes}`;
  $('#mistakeline').textContent = S.scene==='title' ? '' : `Detective ${S.name} · Wrong turns so far: ${S.mistakes}`;
}
function toggleFile(){ $('#casefile').classList.toggle('open'); }
function closeFile(){ $('#casefile').classList.remove('open'); }
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- helpers ---------- */
function say(who, av, html){ return `<div class="say"><div class="av">${av}</div><div><div class="who">${who}</div>${html}</div></div>`; }
const RUIZ = h => say('Det. Casey Morgan','🕵️‍♀️',h);
const KIM  = h => say('Dr. Lena Ward · forensic anthropologist','🦴',h);
const SAM  = h => say('Sam Taylor · blood lab','🩸',h);
const JORD = h => say('Jordan Bell · DNA analyst','🧬',h);
function note(title, html){ return `<div class="note"><b class="h">🔬 ${title}</b>${html}</div>`; }
function fb(id, ok, msg){ const el=document.getElementById(id); if(!el) return; el.className='fb '+(ok?'ok':'no'); el.innerHTML=(ok?'✅ ':'🤔 ')+msg; el.hidden=false; }
const backBtn = (label='← Back to the Case Board') => `<button class="btn ghost" onclick="go('hub')">${label}</button>`;

/* multiple choice: choices = [[html, correct, feedback], ...] */
function mc(qid, prompt, choices, nextHtml='', onRight=null){
  Q[qid] = {choices, onRight, solved:false};
  return `<div class="q" id="${qid}"><p class="prompt">${prompt}</p><div class="opts">
    ${choices.map((c,i)=>`<button class="opt" onclick="pick('${qid}',${i})">${c[0]}</button>`).join('')}
  </div><div class="fb" id="${qid}-fb" hidden></div><div class="next" id="${qid}-next" hidden>${nextHtml}</div></div>`;
}
function pick(qid, i){
  const q=Q[qid]; if(!q||q.solved) return;
  const c=q.choices[i]; const btns=document.querySelectorAll(`#${qid} > .opts > .opt`); const b=btns[i];
  if(c[1]){ q.solved=true; b.classList.add('right'); btns.forEach(x=>x.disabled=true); fb(qid+'-fb',true,c[2]);
    document.getElementById(qid+'-next').hidden=false; if(q.onRight) q.onRight(); }
  else { oops(); b.classList.add('wrong'); b.disabled=true; fb(qid+'-fb',false,c[2]); }
}

/* ---------- figures ---------- */
function pelvis(angle, caption, evidence){
  const cx=130, vy=150, L=62, a=angle/2*Math.PI/180;
  const lx=cx-L*Math.sin(a), rx=cx+L*Math.sin(a), y2=vy+L*Math.cos(a);
  const s = angle>90 ? 1.13 : .9;
  const accL=[78,140], accR=[182,140];
  const oL=[(accL[0]+cx+lx)/3+2,(accL[1]+vy+y2)/3], oR=[(accR[0]+cx+rx)/3-2,(accR[1]+vy+y2)/3];
  const ar=26, ax1=cx-ar*Math.sin(a), ay=vy+ar*Math.cos(a), ax2=cx+ar*Math.sin(a);
  const wing = side => { const m = side<0 ? (x=>cx-(cx-x)*s) : (x=>cx+(x-cx)*s);
    const X = x => side<0 ? m(x) : m(2*cx-x);
    return `<path d="M${X(116)} 62 C ${X(96)} 30, ${X(40)} 22, ${X(26)} 52 C ${X(18)} 78, ${X(44)} 112, ${X(side<0?accL[0]:78)} 132 L ${X(108)} 122 Z"/>`; };
  return `<div class="figbox ${evidence?'ev':''}"><svg class="fig" viewBox="0 0 260 235" role="img" aria-label="Simplified pelvis with a subpubic angle of about ${angle} degrees">
   <g fill="#efe4c8" stroke="#7a6545" stroke-width="2" stroke-linejoin="round">${wing(-1)}${wing(1)}
     <path d="M112 56 L148 56 L141 118 L130 136 L119 118 Z" fill="#e6d8b4"/></g>
   <g stroke="#7a6545" stroke-width="16" stroke-linecap="round" fill="none">
     <path d="M${accL[0]} ${accL[1]} L${cx-4} ${vy} M${cx-4} ${vy} L${lx} ${y2} M${accL[0]} ${accL[1]} L${lx} ${y2}"/>
     <path d="M${accR[0]} ${accR[1]} L${cx+4} ${vy} M${cx+4} ${vy} L${rx} ${y2} M${accR[0]} ${accR[1]} L${rx} ${y2}"/></g>
   <g stroke="#efe4c8" stroke-width="11" stroke-linecap="round" fill="none">
     <path d="M${accL[0]} ${accL[1]} L${cx-4} ${vy} L${lx} ${y2} Z M${accR[0]} ${accR[1]} L${cx+4} ${vy} L${rx} ${y2} Z"/></g>
   <ellipse cx="${oL[0]}" cy="${oL[1]}" rx="7" ry="10" fill="#fff" stroke="#7a6545" stroke-width="1.5"/>
   <ellipse cx="${oR[0]}" cy="${oR[1]}" rx="7" ry="10" fill="#fff" stroke="#7a6545" stroke-width="1.5"/>
   <circle cx="${accL[0]}" cy="${accL[1]}" r="11" fill="#d8c69c" stroke="#7a6545" stroke-width="2"/>
   <circle cx="${accR[0]}" cy="${accR[1]}" r="11" fill="#d8c69c" stroke="#7a6545" stroke-width="2"/>
   <path d="M${ax1} ${ay} A ${ar} ${ar} 0 0 0 ${ax2} ${ay}" fill="none" stroke="#b23a2e" stroke-width="3"/>

  </svg><div class="cap">${caption}</div></div>`;
}
function femurSVG(){
  const x0=30, k=12, xe=x0+44.5*k; let t='';
  for(let i=0;i<=100;i++){ const cm=i/2, x=x0+cm*k, big=cm%5===0, whole=cm%1===0, h=big?18:whole?11:6;
    t+=`<line x1="${x}" y1="104" x2="${x}" y2="${104+h}" stroke="#3a3326" stroke-width="${big?1.6:1}"/>`;
    if(big) t+=`<text x="${x}" y="138" font-size="13" text-anchor="middle" fill="#3a3326" font-family="Source Sans 3">${cm}</text>`; }
  return `<svg viewBox="0 0 640 150" class="fig" role="img" aria-label="A femur lying on a centimeter ruler; its far end lines up halfway between 44 and 45 centimeters">
   <rect x="20" y="100" width="612" height="44" rx="4" fill="#f3d98b" stroke="#a88a3a"/>${t}
   <text x="622" y="122" font-size="12" text-anchor="end" fill="#3a3326">cm</text>
   <line x1="${x0}" y1="18" x2="${x0}" y2="104" stroke="#b23a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
   <line x1="${xe}" y1="18" x2="${xe}" y2="104" stroke="#b23a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
   <g fill="#efe4c8" stroke="#7a6545" stroke-width="2" stroke-linejoin="round">
     <path d="M${x0+18} 42 L${x0+52} 50 L${x0+52} 68 L${x0+20} 60 Z"/>
     <ellipse cx="${x0+58}" cy="52" rx="16" ry="13"/>
     <path d="M${x0+52} 49 C ${x0+200} 56, ${xe-200} 55, ${xe-40} 46 L ${xe-40} 74 C ${xe-200} 66, ${x0+200} 68, ${x0+52} 70 Z"/>
     <ellipse cx="${xe-22}" cy="52" rx="22" ry="15"/><ellipse cx="${xe-22}" cy="70" rx="22" ry="14"/>
     <circle cx="${x0+15}" cy="48" r="15"/></g>
   <text x="${x0+15}" y="14" font-size="11" text-anchor="middle" fill="#b23a2e">hip end</text>
   <text x="${xe}" y="14" font-size="11" text-anchor="middle" fill="#b23a2e">knee end</text>
  </svg>`;
}
function rng(seed){ let s=seed; return ()=>((s=(s*9301+49297)%233280)/233280); }
function well(key, clumps, added){
  const r=rng(key.length*97+13); let dots='';
  if(added && clumps){ for(let i=0;i<34;i++){ const ang=r()*Math.PI*2, d=Math.sqrt(r())*34; dots+=`<circle cx="${50+Math.cos(ang)*d}" cy="${50+Math.sin(ang)*d}" r="${1.8+r()*3.6}" fill="#7d1418"/>`; } }
  const fill = !added ? '#f4efe6' : clumps ? '#f2cdc6' : 'url(#smooth)';
  return `<svg viewBox="0 0 100 100" width="110" height="110" role="img" aria-label="${!added?'empty test well':clumps?'clumped blood drop':'smooth blood drop'}">
    <defs><radialGradient id="smooth" cx="40%" cy="35%"><stop offset="0" stop-color="#d7414a"/><stop offset="1" stop-color="#9b1c24"/></radialGradient></defs>
    <circle cx="50" cy="50" r="44" fill="#fff" stroke="#c9bfae" stroke-width="3"/>
    <circle cx="50" cy="50" r="38" fill="${fill}"/>${dots}
    ${!added?'<text x="50" y="55" text-anchor="middle" font-size="11" fill="#9a907f">sample only</text>':''}</svg>`;
}
const GEL = { ladder:[1000,900,800,700,600,500,400,300,200,100],
  E:[850,600,420,230], V:[700,520,380,160], gordon:[900,520,300,180], theo:[700,600,380,300], alan:[800,450,350,230], megan:[850,600,420,230] };
function gelSVG(sel){
  const lanes=[['L','Ladder',null],['E','Trowel blood',null],['V','Nell (tooth)','V'],['S1','Gordon','gordon'],['S2','Theo','theo'],['S3','Alan','alan'],['S4','Megan','megan']];
  const key={L:'ladder',E:'E',V:'V',S1:'gordon',S2:'theo',S3:'alan',S4:'megan'};
  const y = bp => 70 + (Math.log10(1100)-Math.log10(bp))/(Math.log10(1100)-Math.log10(90))*300;
  let g='';
  lanes.forEach((ln,i)=>{ const x=30+i*68, click=ln[2];
    const bands = GEL[key[ln[0]]].map(bp=>`<rect x="${x+8}" y="${y(bp)-3}" width="46" height="6" rx="2" fill="${ln[0]==='E'?'#ffd36b':'#9fe8ff'}" filter="url(#glow)"/>`).join('');
    g += `<g ${click?`class="lane ${sel===click?'sel':''}" onclick="gelPick('${click}')" role="button" tabindex="0" aria-label="Lane ${ln[0]}: ${ln[1]}" onkeydown="if(event.key==='Enter')gelPick('${click}')"`:''}>
      <rect class="lanebg" x="${x+2}" y="44" width="58" height="350" rx="6" fill="transparent"/>
      <rect x="${x+10}" y="50" width="42" height="9" rx="2" fill="#0a0f19" stroke="#55657f"/>
      ${bands}
      <text x="${x+31}" y="24" text-anchor="middle" fill="#fff" font-family="Special Elite" font-size="15">${ln[0]}</text>
      <text x="${x+31}" y="38" text-anchor="middle" fill="#a9b7cc" font-size="10.5">${ln[1]}</text></g>`; });
  return `<svg viewBox="0 0 520 420" role="img" aria-label="DNA gel with seven lanes">
    <defs><filter id="glow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect x="22" y="44" width="486" height="352" rx="8" fill="#1b2a44" stroke="#33486b"/>
    <text x="10" y="60" fill="#ff8a7a" font-size="16" font-weight="700">−</text>
    <text x="8" y="392" fill="#7fe0a0" font-size="16" font-weight="700">+</text>
    ${g}</svg>`;
}

    box.className='mark '+(v===m.ans?'okm':'nom'); why.textContent=(v===m.ans?'✅ ':'🤔 ')+m.why[v]; if(v===m.ans) right++; });
  if(blank) return fb('mk-fb',false,'Choose a timing for every mark first.');
  if(right===3){ fb('mk-fb',true,'All three correct! You read the bones like a pro.'); $('#mk-next').hidden=false; document.querySelectorAll('.marks select').forEach(s=>s.disabled=true); }

    ['B−',false,'Check the Anti-Rh drop. It clumped, so the blood is Rh-positive.']

    ['Yes, it’s probably Nell’s blood',false,'Type O blood has no B antigens, so it wouldn’t clump with Anti-B. This isn’t Nell’s blood.'],
    ['No, it must be someone else’s',true,'Right. Someone else bled on this trowel, quite possibly the attacker, cut during the struggle. But about 1 in 11 people in the U.S. have B+ blood, so a blood type can <b>narrow the list</b>, not name a person. For that, we need DNA.']

  }[k];
  return `<section class="card ending"><div class="stampbig alt">ALTERNATE ENDING</div><h2>Wrong Suspect</h2>
  <p>You arrest <b>${SUS[k].name}</b>. A few weeks later, the case collapses in court.</p><p>${why}</p>
  <p>Somewhere in Briar Hollow, the real killer breathes a sigh of relief… for now.</p>
  ${note('Detective lesson','Motive makes someone a suspect. Physical evidence is what proves a case.')}
  <button class="btn primary" onclick="go('hub')">⏪ Back to the Case Board</button></section>`;
};
SC.endHunch = () => `<section class="card ending"><div class="stampbig alt">ALTERNATE ENDING</div><h2>A Hunch Isn’t Proof</h2>
  <p>You arrest <b>Megan Reed</b>. You might be right… but her lawyer argues that a motive and an old scar aren’t proof of anything.</p>
  <p>Without scientific evidence tying her to the scene, the judge dismisses the case.</p>
  ${RUIZ('<p>Good instincts, Detective. Now go <b>prove</b> it.</p>')}
  <button class="btn primary" onclick="go('hub')">⏪ Back to the Case Board</button></section>`;
SC.endBest = () => {
  const m=S.mistakes;
  const rank = m<=2 ? ['🏅','Master Detective','Flawless forensic work. The crime lab wants to hire you.'] :
               m<=5 ? ['🎖️','Senior Investigator','Solid work. A few wrong turns, but you followed the evidence home.'] :
                      ['⭐','Rookie with Potential','You cracked it! Every great detective starts somewhere.'];
  return `<section class="card ending"><div class="stampbig">CASE CLOSED</div><h2>Justice for Nell</h2>
  <p>Faced with the DNA results, <b>Megan Reed</b> confesses.</p>
  <p>For months she had been secretly selling the greenhouse’s rarest orchids and keeping the money. When Nell found the sales in the ledger, she asked Megan to meet her at the greenhouse. They argued, and in a moment of anger Megan struck Nell with a garden trowel, cutting her own palm on the blade. She buried Nell near the potting bench, hid the trowel nearby, and told everyone Nell had simply “run off.”</p>
  <p>Two years later, the bones and the blood told the truth.</p>
  ${say('Theo Hartwell','💐','<p>“All this time, people thought she just left us. Thank you for bringing my sister home.”</p>')}
  <div class="cert"><div style="font-size:2.6rem">${rank[0]}</div><div class="small">Briar Hollow Police Department hereby recognizes</div>
    <div class="type" style="font-size:1.5rem;margin:4px 0">Detective ${S.name}</div><div class="rank">${rank[1]}</div>
    <p style="margin:.4em 0 0">${rank[2]}</p><p class="small">Wrong turns: ${m} · Clues found: ${S.clues.length} of 17</p>
    <p class="small">Show this screen to your event host!</p></div>
  <h3>How the evidence fit together</h3>
  <ol class="chain">
    <li><b>Bones</b> showed a female, 25–40, about 164 cm tall, with a healed broken arm. That matched Nell Hartwell.</li>
    <li>A <b>perimortem</b> skull injury showed this was a homicide.</li>
    <li>The <b>trowel</b>, collected without contamination, carried someone’s blood.</li>
    <li><b>Blood typing</b> showed B+, which wasn’t Nell’s and ruled out Gordon and Alan.</li>
    <li><b>DNA fingerprinting</b> matched the blood to Megan on every band.</li>
    <li>The <b>ledger</b>, the planner and the <b>scar</b> explained why it happened.</li>
  </ol>
  <button class="btn primary" onclick="restart()">🔁 Play again</button> <a class="btn ghost" style="text-decoration:none" href="index.html">← Back to all stations</a></section>`;
};
function restart(){ S=fresh(); elimSolved=false; gelSolved=false; go('title'); }

/* reset per-visit DNA flags when entering the lab */
const _dna = SC.dna; SC.dna = () => { elimSolved=false; gelSolved=false; return _dna(); };

go('title');
</script>
